<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0A07" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/mistroot-favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The two faces above the fold. The rest load from the bundled CSS. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/cormorant-garamond-v21-400-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/josefin-sans-v34-400-latin.woff2"
      crossorigin
    />
    <!--seo-->
    <title>MistRoot Coffee</title>
    <noscript>
      <style>
        /* Scroll reveals and page-entry animations never run without
           JavaScript, so anything they would have faded in has to start
           visible rather than stay at opacity 0. */
        [style*='opacity:0'],
        [style*='opacity: 0'] {
          opacity: 1 !important;
          transform: none !important;
        }
        .wr__word {
          transform: none !important;
        }
        .xp__panel {
          height: auto !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
