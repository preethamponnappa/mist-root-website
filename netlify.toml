[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Routing note: every route is prerendered to its own file by
# scripts/prerender.mjs (dist/story.html, dist/club.html, …), so Netlify serves
# real HTML for each path directly. The old catch-all rewrite to /index.html is
# deliberately gone — it turned every typo into a soft 404 that answered 200.
# Unmatched paths now fall through to dist/404.html, which Netlify serves with a
# genuine 404 status.

# Canonicalise away the trailing slash. Listed one route at a time rather than
# as a pattern so the root can never match and loop on itself. Keep in sync with
# ROUTES in src/lib/seo.js.
[[redirects]]
  from = "/story/"
  to = "/story"
  status = 301
  force = true

[[redirects]]
  from = "/club/"
  to = "/club"
  status = 301
  force = true

[[redirects]]
  from = "/brewing/"
  to = "/brewing"
  status = 301
  force = true

[[redirects]]
  from = "/experiences/"
  to = "/experiences"
  status = 301
  force = true

[[redirects]]
  from = "/contact/"
  to = "/contact"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
