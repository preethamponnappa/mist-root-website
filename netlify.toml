[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --------------------------------------------------------------- routing ---
# Every route is prerendered to its own file by scripts/prerender.mjs
# (dist/story.html, dist/club.html, …), so Netlify serves real HTML for each
# path directly. The old catch-all rewrite to /index.html is deliberately gone
# — it turned every typo into a soft 404 that answered 200. Unmatched paths now
# fall through to dist/404.html, which Netlify serves with a genuine 404.

# No trailing-slash rules here on purpose. Netlify matches a redirect source
# with and without its trailing slash, so an explicit "/story/" -> "/story"
# rule with force = true also matches /story and 301s it to itself. Netlify
# already normalises /story/ to /story for a flat story.html, which is verified
# in the notes below; the canonical tag on every page is the backstop.

# --------------------------------------------------------------- headers ---
# Content-Security-Policy is deliberately not here: it carries hashes of
# React's inline bootstrap scripts, so scripts/prerender.mjs generates it into
# dist/_headers where it stays in step with the build.

# Security headers on every response. Deliberately no Cache-Control here: a
# catch-all Cache-Control competes with the per-directory rules below, and
# Netlify already serves HTML as must-revalidate, which is what HTML wants.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "accelerometer=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=(), autoplay=(self), fullscreen=(self)"

# Everything below carries a content hash or a font version in its filename, so
# a changed file is a changed URL and these can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
